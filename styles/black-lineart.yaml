identity:
  name: "Black Line-Art (黑底手绘)"
  category: blackboard-lineart
  mood: 直给、有观点、略带犀利
  pace: fast
  best_for: "口播观点 / 认知拆解 / 硬核励志（纯黑底 + 白描边 + 手绘线稿 + 大字）"

# 本 playbook 承载颜色与字体层（渲染器会读的那部分，见 F-22）。
# 真正的识别度在"黑底 + 抠像白描边 + 手绘线稿 + 快节奏大字"，
# 配方见 docs/04-style-profile-black-lineart.md。

visual_language:
  color_palette:
    primary: ["#F0F0F0", "#FFFFFF"]        # 白：主体线条与大字
    accent: ["#E8C87A", "#D0D0A0"]         # 暖金：字幕与强调
    background: "#070503"                  # 近纯黑（微暖）
    surface: "#141210"                     # 卡片/描边底的深灰
    text: "#F0F0F0"
    muted: "#8A8A8A"
  composition: subject centered or left; 大字占上半幅；留白极大（黑即是留白）
  texture: none — 纯色黑底，不上纸纹/颗粒

typography:
  headings:
    font: "Hanzipen SC"                    # 翩翩体：手写感，配手绘线稿
    weight: 400
    alternates: ["Weibei SC", "Kaiti SC"]
  body:
    font: "PingFang SC"
    weight: 400
  captions:
    cn_font: "PingFang SC Semibold"
    cn_size: 68
    cn_color: "#E8C87A"                    # 暖金；部分场景用白
    cn_y_ratio: 0.885                      # 参考片字幕带 85–95%
    stroke_px: 0                           # 黑底上不需要描边

# ── 声音：定稿链（自然优先，追求的是"不像 TTS"而不是"像某支参考片"）────────
# 实测定稿：带限到 9kHz 是提升自然度最大的一步（去电子嘶声）；
# 不做声纹匹配——精确匹配参考片需要 +10dB 窄带提升 + −18dB 高切，声音会"电话化"。
voice:
  engine: "doubao"
  voice_id: "zh_male_ruyayichen_saturn_bigtts"    # 商用授权
  speech_rate_by_beat: {emotional: 10, informational: 24, default: 18}
  post_chain:
    - "highpass=f=70"                             # TTS 自带 3-5% 次声隆隆
    - "lowpass=f=9000"                            # ★ 去电子嘶声，自然度提升最大
    - "equalizer=f=250:t=q:w=1.0:g=1.5"           # 胸腔厚度
    - "equalizer=f=3200:t=q:w=1.0:g=2"            # 存在感
    - "acompressor=threshold=-20dB:ratio=2.2:attack=12:release=140:makeup=1"
    - "loudnorm=I=-14:TP=-1.5:LRA=10"
  loudness_trim_db: 1.6                           # 单遍 loudnorm 落点不准，补正
  limiter: "alimiter=limit=0.84"

# ── BGM：程序化生成（零版权风险），配比照参考片实测 ────────────────────
bgm:
  source: "procedural"                            # pipeline/music.py，Am-F-C-G 钢琴+铺底
  # ⚠️ Pixabay 免版权库的路走不通：pixabay_music 工具返回 403
  speech_to_bgm_db: 10                            # 参考片实测 9.6 / 10.8 / 10.6
  bgm_gain_db: 4.6
  ducking:
    filter: "sidechaincompress=threshold=0.04:ratio=4:attack=25:release=600:makeup=1"
    note: "说话时自动压低音乐，保证旁白清晰"
  fade_out_seconds: 2
  mix_trim_db: -0.6

# ── 画面：定稿参数 ─────────────────────────────────────────────────
visual_lock:
  canvas: [1080, 1920]
  fps: 30
  background: "#070503"
  stroke_color: "#F0F0F0"
  keyword_font: "Hanzipen SC"
  keyword_size: 190
  keyword_colors: {default: "#F0F0F0", concept: "#7AB0FF", conclusion: "#E8C87A"}
  caption: {font: "PingFang SC Semibold", size: 50, color: "#E8C87A", y_ratio: 0.906}
  progress_bar: {x: 60, width: 960, y: 1852, height: 10, track: "#262320", fill: "#E8C87A"}
  draw_in_frames: 14                              # 每屏入画动画帧数
  accent_rule: "underline if idx%3==0; ellipse if idx%3==1 (cap 620px); sparkle every 4th"
  screen_seconds_avg: 2.8

motion:
  transitions: [cut]
  animation_style: "硬切为主；线稿可用描边动画逐笔出现"
  pacing_rules:
    max_scene_hold_seconds: 3.0            # 参考片约 1.7 秒一句
    transition_duration_seconds: 0.0
  entrance: "cut"
  exit: "cut"

audio:
  voice_style: "口播感、语速偏快、有态度"
  music_mood: "低调铺底或无音乐"
  music_volume: 0.10

asset_generation:
  image_prompt_prefix: "white line art on pure black background, hand-drawn marker style, minimal, "
  image_negative_prompt: "photo, paper texture, vintage, color photo, clutter, gradient background"
  consistency_anchors:
    - "纯黑底 #070503，不要任何纹理"
    - "白色手绘线条，粗细不均（马克笔感）"
    - "元素极少，一屏一个概念"

quality_rules:
  - "亮部只占画面极小面积（黑底风格靠留黑）"
  - "大字每屏 ≤5 个字"
  - "字幕单语（中文），不要英文——参考片是单语"
  - "不要位移/推镜（会造成抖动）"

chart_palette:
  - "#F0F0F0"
  - "#E8C87A"
  - "#8A8A8A"
